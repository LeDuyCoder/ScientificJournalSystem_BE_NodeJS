version: '3.8'

services:
  backend:
    image: ghcr.io/leduycoder/scientificjournalsystem-be:latest
    container_name: researchpulse_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    networks:
      - app-network

networks:
  app-network:
    external: true