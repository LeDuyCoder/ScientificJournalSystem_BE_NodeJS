name: CI

on:
  push:
    branches:
      - main
      - dev
      - feat/CI_CD-action

  pull_request:
    branches:
      - main
      - dev
      - feat/CI_CD-action

jobs:

  # ========================================
  # JOB 1 - Checkout
  # ========================================
  checkout:
    name: 1. Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  # ========================================
  # JOB 2 - Setup Node.js
  # ========================================
  setup-node:
    name: 2. Setup Node.js
    needs: checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


  # ========================================
  # JOB 3 - Install Dependencies
  # ========================================
  install:
    name: 3. Install Dependencies
    needs: setup-node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


  # ========================================
  # JOB 4 - Prisma Generate
  # ========================================
  prisma-generate:
    name: 4. Prisma Generate
    needs: install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate


  # ========================================
  # JOB 5 - Database Migration
  # ========================================
  database-migration:
    name: 5. Database Migration
    needs: prisma-generate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scientificjournalsystem_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d scientificjournalsystem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scientificjournalsystem_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy


  # ========================================
  # JOB 6 - Run Tests
  # ========================================
  test:
    name: 6. Run Tests
    needs: database-migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scientificjournalsystem_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d scientificjournalsystem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scientificjournalsystem_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test